# Which dependencies NibKeep may use. Check with `cargo deny check`.
# Licenses must keep closed apps and app stores possible (see [licenses] below).

[graph]
# Check every feature, so that optional dependencies follow the rules too.
all-features = true
# The platforms NibKeep builds for. Crates that only a web browser's build needs,
# such as iroh's WebSockets for WebAssembly, are left out.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-linux-android",
]

[advisories]
# Crates with known vulnerabilities fail the check. Unmaintained and yanked
# crates are reported too. Every ignored advisory needs a comment saying why.
ignore = [
    # Unmaintained, not vulnerable: since zbus 6 these live inside zbus itself. They
    # come with zbus 5, which zbus-secret-service-keyring-store 1.0.1, its latest
    # release, still needs for the Linux keyring. Remove when it moves to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant: merged into zbus 6; the keyring store is on zbus 5" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: merged into zbus 6; the keyring store is on zbus 5" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: merged into zbus 6; the keyring store is on zbus 5" },
    # Unmaintained, not vulnerable: a macro crate that the netlink crates use, through
    # which iroh watches the network interfaces on Linux. Remove when they drop it.
    { id = "RUSTSEC-2024-0436", reason = "paste: used at build time by netlink crates under iroh" },
    # Unmaintained, not vulnerable: nom-exif 3.8.0, its latest release, needs it for
    # the dates of photos' metadata. Remove when nom-exif drops it.
    { id = "RUSTSEC-2026-0543", reason = "chrono: required by nom-exif, which reads photos' metadata" },
]

[licenses]
# Permissive licenses and MPL-2.0 only. GPL, AGPL and LGPL code would block
# closed apps built on NibKeep and distribution through app stores.
allow = [
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"BSL-1.0",
	"CC0-1.0",
	# The data of Mozilla's root certificates, in webpki-roots, which iroh brings for
	# relays: a permissive license for data.
	"CDLA-Permissive-2.0",
	"ISC",
	"MIT",
	"MPL-2.0",
	"Unicode-3.0",
	"Zlib",
]
confidence-threshold = 0.9
# The list is a policy, not an inventory, so licenses no crate uses yet are fine.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
# Every dependency names a version. Path dependencies between the
# workspace's own unpublished crates are the exception.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Only crates.io: no other registries and no git repositories.
unknown-registry = "deny"
unknown-git = "deny"
