[package]
name = "nibkeep-testkit"
description = "Repeatable randomness, identifiers, keys and times for the tests of NibKeep"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
nibkeep-base = { workspace = true }
nibkeep-crypto = { workspace = true }
nibkeep-time = { workspace = true }
blake3 = { workspace = true }

# Raising the limit of open files, which iOS sets low for an app.
[target.'cfg(target_os = "ios")'.dependencies]
rustix = { workspace = true, features = ["process"] }

# Reading the size that the kernel holds of a file on LazyFS, without asking LazyFS.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true }

[lints]
workspace = true
