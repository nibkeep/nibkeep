[package]
name = "nibkeep-generate"
description = "Libraries made from a seed, of any size: the compatibility fixtures, and the data of the benchmarks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
nibkeep-base = { workspace = true }
nibkeep-crypto = { workspace = true }
nibkeep-governance = { workspace = true }
nibkeep-model = { workspace = true }
nibkeep-node = { workspace = true }
nibkeep-std = { workspace = true }
nibkeep-testkit = { workspace = true }
nibkeep-time = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
rusqlite = { workspace = true }

# The workspace's lints, with `unsafe` code denied rather than forbidden, so that
# nibkeep-bench can ask Windows for its peak memory: a crate cannot loosen a lint that the
# workspace forbids.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
