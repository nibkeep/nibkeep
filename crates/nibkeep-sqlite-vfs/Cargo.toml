[package]
name = "nibkeep-sqlite-vfs"
description = "Lets a VFS written in safe Rust serve SQLite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
publish.workspace = true

[dependencies]
libsqlite3-sys = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
nibkeep-testkit = { workspace = true }
rusqlite = { workspace = true }

# The workspace's lints, but for its ban on `unsafe` code: this crate is the one exception
# (technical design: the state file). Every `unsafe` block must say why it is sound.
[lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
